schema_version: 1
reviewed_at: "2026-10-03"
documents:
  - id: nmmss-2026-release
    programme_id: nmmss
    publisher_role: issuer_release
    source_capabilities: [deadline, amendment, eligibility]
    url: https://www.pib.gov.in/PressReleasePage.aspx?PRID=2317657&lang=2&reg=48
    blocks:
      - block_id: nmmss26-scope
        kind: excerpt
        location: release body, scope excerpts
        text: |-
          The Union Ministry of Education has extended the last date for submission of applications under the National Means-cum-Merit Scholarship Scheme (NMMSS) for the academic year 2026-27 to October 31, 2026.
          As on September 30, 2026, 88,522 fresh and 1,97,133 renewal applications had been submitted.
      - block_id: nmmss26-schedule
        kind: table
        location: revised schedule table
        text: |-
          Process | Last Date
          Submission of Application | October 31, 2026
          Institute Nodal Officer (L1) Verification | November 15, 2026
          District Nodal Officer (L2) Verification | November 30, 2026
        metadata:
          headers: [Process, Last Date]
          rows:
            - [Submission of Application, "October 31, 2026"]
            - [Institute Nodal Officer (L1) Verification, "November 15, 2026"]
            - [District Nodal Officer (L2) Verification, "November 30, 2026"]
      - block_id: nmmss26-income
        kind: excerpt
        location: release body, eligibility paragraph
        text: The parental income of the applicant should not exceed ₹3.50 lakh per annum.

  - id: nmmss-2025-release
    programme_id: nmmss
    publisher_role: issuer_release
    source_capabilities: [deadline, amendment, eligibility, application_process]
    url: https://www.pib.gov.in/PressReleasePage.aspx?PRID=2167076&lang=2&reg=48
    blocks:
      - block_id: nmmss25-scope
        kind: excerpt
        location: release body, scope excerpts
        text: |-
          The last date for submission of applications by the selected meritorious students on the National Scholarship Portal (NSP) for National Means cum Merit Scholarship Scheme (NMMSS) for the year 2025-26 has been extended to 30th September, 2025.
          As of 30.08.2025, 85420 fresh and 172027 renewal applications have been finally submitted by the applicants.
      - block_id: nmmss25-verification
        kind: excerpt
        location: release body, verification paragraph
        text: On the NSP portal, there are two levels of verification of the scholarship application of selected students, Level-1 (L1) verification is at the Institute Nodal Officer (INO) and Level-2 (L2) is with the District Nodal Officer (DNO). The last date for INO level (L1) verification is 15.10.2025 and for DNO level (L2) verification is 31.10.2025.
      - block_id: nmmss25-income
        kind: excerpt
        location: release body, eligibility paragraph
        text: The eligibility parameters for availing the scholarship include parental income not more than Rs. 3.50 lakh per annum.

