  - id: nos-2026-guidelines
    programme_id: national-overseas-scholarship
    publisher_role: issuer_document
    source_capabilities: [eligibility, application_process]
    url: https://socialjustice.gov.in/writereaddata/UploadFile/68641776927848.pdf
    blocks:
      - block_id: nos-guideline-rounds
        kind: page_text
        location: page 4
        text: The selection year period would be April-March of each year. The portal shall be opened for calling of applications for the first round in April/May for a period of 40 days for inviting of applications online and after this period, the portal will be opened again for 4 days to allow the candidates to make corrections, if any, in the submitted applications and only online applications received shall be considered for award of selection. For example, for the selection year 2026-27, online portal for inviting applications of NOS Scholarship for first round will be opened in April/May 2026 for a period of 40 days for inviting of applications online and 4 days will be given for correction.

